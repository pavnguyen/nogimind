  <body>
    <div id="root"></div>
    <!--
      Resolve the appearance preference before the first paint, so a returning
      user never sees the app flash the wrong mode. Mirrors `resolveTheme` in
      src/utils/theme.ts, plus the v0 → v1 migration in
      src/stores/useSettingsStore.ts (the stored shape is zustand/persist's), and
      is the only reason the stylesheet can key light mode off `html[data-theme]`
      instead of a media query. If anything here throws, the app still starts: the
      stylesheet falls back to dark and useThemeSync re-applies the preference on
      mount.
    -->
    <script>
      (function () {
        var dark = false
        try {
          var preference = 'light'
          var raw = window.localStorage.getItem('nogi_settings')
          if (raw) {
            var persisted = JSON.parse(raw)
            var stored = (persisted && persisted.state && persisted.state.theme) || null
            // v0 defaulted to `system`; treat that as the new `light` default.
            if (!(persisted.version >= 1) && (stored === null || stored === 'system')) stored = 'light'
            if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
          }
          var prefersDark =
            !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches
          dark = preference === 'system' ? prefersDark : preference === 'dark'
        } catch {
          /* storage disabled or unreadable — keep the light default */
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
